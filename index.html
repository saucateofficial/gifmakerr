<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>GIF Stüdyo 4K</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#6c8cff;--acc2:#4f6de0}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{padding:20px 16px;text-align:center;border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.5rem}
  header p{margin:6px 0 0;color:var(--mut);font-size:.9rem}
  main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:1.05rem}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--mut);cursor:pointer;transition:.2s}
  .drop.over{border-color:var(--acc);color:var(--txt)}
  .drop b{color:var(--txt)}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;cursor:pointer;font-size:.95rem}
  .tab.active{background:var(--acc);border-color:var(--acc);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--mut)}
  input,select{background:#0f1218;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:.95rem;width:100%}
  input[type=color]{padding:2px;height:40px}
  input[type=range]{padding:0}
  .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:12px}
  .th{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0f1218}
  .th img{width:100%;height:80px;object-fit:cover;display:block}
  .th .bar{display:flex;justify-content:space-between;padding:2px}
  .th button{background:#222836;color:var(--txt);border:0;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:.8rem}
  .th .n{position:absolute;top:4px;left:4px;background:#000a;border-radius:6px;padding:1px 6px;font-size:.7rem}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px 20px;font-size:1rem;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--acc2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.sec{background:#222836}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  progress{width:100%;height:14px}
  #info{color:var(--mut);font-size:.85rem;margin-top:8px}
  .warn{color:#ffb86b}
  #result{display:none;text-align:center}
  #result img{max-width:100%;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(#222 0 25%,#1a1a1a 0 50%) 0 0/20px 20px}
  video{max-width:100%;border-radius:8px;margin-top:10px}
  .hide{display:none!important}
  /* Çift tutamaçlı aralık seçici */
  .rng{position:relative;height:44px}
  .rtrack,.rfill{position:absolute;top:19px;height:6px;border-radius:3px}
  .rtrack{left:0;right:0;background:var(--line)}
  .rfill{background:var(--acc)}
  .rng input[type=range]{position:absolute;left:0;top:0;width:100%;height:44px;margin:0;padding:0;border:0;background:transparent;pointer-events:none;-webkit-appearance:none;appearance:none;z-index:2}
  .rng input[type=range]::-webkit-slider-runnable-track{background:transparent;height:44px;border:0}
  .rng input[type=range]::-moz-range-track{background:transparent;border:0}
  .rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--acc);margin-top:9px;cursor:pointer}
  .rng input[type=range]::-moz-range-thumb{pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--acc);cursor:pointer}
  /* Dosya girişi: display:none yerine görünmez ama erişilebilir (mobilde galeri/dosya seçici güvenle açılır) */
  .vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
  label.drop{display:block;font-size:1rem}
  footer{text-align:center;color:var(--mut);font-size:.8rem;padding:20px}

  /* ---- Tüm cihazlar için ortak iyileştirmeler ---- */
  html{-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow-x:hidden}
  input,select,button{font-family:inherit;font-size:16px;touch-action:manipulation} /* iOS yakınlaşmasını engeller */
  select{appearance:auto}
  .btn,.tab,.th button{min-height:44px;-webkit-tap-highlight-color:transparent} /* dokunmatik hedef boyutu */
  .th button{min-width:44px}
  img,video,canvas{max-width:100%;height:auto}
  main{width:100%}

  /* ---- Tablet ---- */
  @media (max-width:900px){
    main{padding:12px}
    .grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
  }

  /* ---- Telefon ---- */
  @media (max-width:600px){
    header{padding:14px 12px}
    header h1{font-size:1.25rem}
    header p{font-size:.8rem}
    main{padding:10px;gap:12px}
    .card{padding:12px;border-radius:10px}
    .drop{padding:22px 10px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .thumbs{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
    .th img{height:70px}
    .th button{min-width:0;flex:1;padding:6px 0}
    .th .bar{gap:2px}
    .row{flex-direction:column;align-items:stretch}
    .row .btn{width:100%}
    #dl{display:block!important;text-align:center}
    #go{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 4px 18px #000a}
  }
  @media (max-width:380px){ .grid{grid-template-columns:1fr} }

  /* ---- Geniş ekran ---- */
  @media (min-width:1400px){ main{max-width:1200px} }
</style>
</head>
<body>
<header>
  <h1>🎞️ GIF Stüdyo 4K</h1>
  <p>Resimlerden veya videodan, tarayıcıda, 4K'ya kadar GIF oluştur. Dosyalar cihazından çıkmaz.</p>
</header>

<main>
  <section class="card">
    <h2>1) Kaynak</h2>
    <div class="tabs">
      <button class="tab active" id="tabImg">Resimlerden</button>
      <button class="tab" id="tabVid">Videodan</button>
    </div>

    <div id="paneImg">
      <label class="drop" id="dropImg" for="fileImg"><b>Resimleri sürükle bırak</b> veya dokun / tıkla<br><small>PNG, JPG, WEBP… (dosya adına göre sıralanır)</small></label>
      <input type="file" id="fileImg" accept="image/*" multiple class="vh">
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div id="paneVid" class="hide">
      <label class="drop" id="dropVid" for="fileVid"><b>Videoyu sürükle bırak</b> veya dokun / tıkla<br><small>MP4, WEBM, MOV…</small></label>
      <input type="file" id="fileVid" accept="video/*,.mp4,.mov,.webm,.m4v" class="vh">
      <video id="vid" controls class="hide" muted playsinline></video>
      <div class="hide" id="vidOpts" style="margin-top:12px">
        <div style="color:var(--mut);font-size:.85rem;margin-bottom:4px">GIF yapılacak aralığı iki tutamaçla seç (video seçtiğin yere atlar):</div>
        <div class="rng">
          <div class="rtrack"></div>
          <div class="rfill" id="rfill"></div>
          <input type="range" id="vStart" min="0" max="1" step="0.1" value="0">
          <input type="range" id="vEnd" min="0.1" max="1" step="0.1" value="1">
        </div>
        <div class="row" style="justify-content:space-between;margin-top:4px;font-size:.9rem">
          <span id="tStart">0.0 sn</span><b id="tLen"></b><span id="tEnd"></span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn sec" id="setS" type="button">⏴ Başlangıcı buraya al</button>
          <button class="btn sec" id="setE" type="button">Bitişi buraya al ⏵</button>
          <button class="btn sec" id="playSel" type="button">▶ Seçimi oynat</button>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>2) Ayarlar</h2>
    <div class="grid">
      <label>Çözünürlük
        <select id="res">
          <option value="480">480p (854×480)</option>
          <option value="720">720p HD (1280×720)</option>
          <option value="1080" selected>1080p Full HD (1920×1080)</option>
          <option value="1440">1440p 2K (2560×1440)</option>
          <option value="2160">2160p 4K UHD (3840×2160)</option>
          <option value="custom">Özel…</option>
          <option value="orig">Orijinal boyut (ilk kare)</option>
        </select>
      </label>
      <label class="hide" id="cwWrap">Özel genişlik (px)<input type="number" id="cw" min="16" max="3840" value="1280"></label>
      <label class="hide" id="chWrap">Özel yükseklik (px)<input type="number" id="ch" min="16" max="2160" value="720"></label>
      <label>Oran / Sığdırma
        <select id="fit">
          <option value="contain">Sığdır (boşluk bırakabilir)</option>
          <option value="cover">Doldur (kırpabilir)</option>
          <option value="stretch">Esnet</option>
        </select>
      </label>
      <label>Arka plan
        <input type="color" id="bg" value="#000000">
      </label>
      <label>Saniyedeki kare (FPS): <span id="fpsV">10</span>
        <input type="range" id="fps" min="1" max="30" value="10">
      </label>
      <label>Renk sayısı: <span id="colV">256</span>
        <input type="range" id="cols" min="8" max="256" step="8" value="256">
      </label>
      <label>Döngü
        <select id="loop">
          <option value="0">Sonsuz</option>
          <option value="-1">Tek sefer</option>
        </select>
      </label>
      <label>Ping-pong (ileri-geri)
        <select id="pp"><option value="0">Kapalı</option><option value="1">Açık</option></select>
      </label>
    </div>
    <div id="info"></div>
  </section>

  <section class="card">
    <h2>3) Oluştur</h2>
    <div class="row">
      <button class="btn" id="go">GIF Oluştur</button>
      <button class="btn sec hide" id="cancel">İptal</button>
    </div>
    <progress id="prog" value="0" max="100" class="hide" style="margin-top:12px"></progress>
    <div id="status" style="color:var(--mut);font-size:.9rem;margin-top:6px"></div>
  </section>

  <section class="card" id="result">
    <h2>Sonuç</h2>
    <img id="out" alt="Oluşturulan GIF">
    <div id="meta" style="color:var(--mut);margin:10px 0"></div>
    <a id="dl" class="btn" style="text-decoration:none;display:inline-block">⬇ GIF'i indir</a>
  </section>
</main>

<footer>Tüm işlem tarayıcında yapılır • GIF kodlama: gifenc</footer>

<script type="module">
import { GIFEncoder, quantize, applyPalette } from "https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.esm.js";

const $ = id => document.getElementById(id);
let mode = "img";
let images = [];          // {file, url, bmp, name}
let videoURL = null;
let cancelled = false;
let lastURL = null;

// ---------- Sekmeler ----------
function setMode(m){
  mode = m;
  $("tabImg").classList.toggle("active", m==="img");
  $("tabVid").classList.toggle("active", m==="vid");
  $("paneImg").classList.toggle("hide", m!=="img");
  $("paneVid").classList.toggle("hide", m!=="vid");
  updateInfo();
}
$("tabImg").onclick = () => setMode("img");
$("tabVid").onclick = () => setMode("vid");

// ---------- Drop alanları ----------
function wireDrop(dropId, inputId, handler){
  const d = $(dropId), i = $(inputId);
  d.ondragover = e => { e.preventDefault(); d.classList.add("over"); };
  d.ondragleave = () => d.classList.remove("over");
  d.ondrop = e => { e.preventDefault(); d.classList.remove("over"); handler([...e.dataTransfer.files]); };
  i.onchange = () => { handler([...i.files]); i.value = ""; };
}
wireDrop("dropImg","fileImg", addImages);
wireDrop("dropVid","fileVid", files => setVideo(files[0]));

// ---------- Resimler ----------
async function addImages(files){
  files = files.filter(f => f.type.startsWith("image/"))
               .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  for(const f of files){
    const url = URL.createObjectURL(f);
    try{
      const bmp = await createImageBitmap(f);
      images.push({file:f,url,bmp,name:f.name});
    }catch(e){ URL.revokeObjectURL(url); }
  }
  renderThumbs(); updateInfo();
}
function renderThumbs(){
  const t = $("thumbs"); t.innerHTML = "";
  images.forEach((im,i)=>{
    const d = document.createElement("div"); d.className="th";
    d.innerHTML = `<span class="n">${i+1}</span><img src="${im.url}" alt=""><div class="bar"><button data-a="l">←</button><button data-a="x">✕</button><button data-a="r">→</button></div>`;
    d.querySelector('[data-a="l"]').onclick = () => move(i,-1);
    d.querySelector('[data-a="r"]').onclick = () => move(i,1);
    d.querySelector('[data-a="x"]').onclick = () => { URL.revokeObjectURL(im.url); im.bmp.close?.(); images.splice(i,1); renderThumbs(); updateInfo(); };
    t.appendChild(d);
  });
}
function move(i,dir){
  const j = i+dir; if(j<0||j>=images.length) return;
  [images[i],images[j]] = [images[j],images[i]];
  renderThumbs();
}

// ---------- Video ----------
function setVideo(f){
  if(!f) return;
  const okType = f.type.startsWith("video/") || /\.(mp4|mov|webm|m4v|mkv|avi)$/i.test(f.name);
  if(!okType){ $("status").textContent = "Lütfen bir video dosyası seç."; return; }
  if(videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(f);
  const v = $("vid");
  v.src = videoURL;
  v.classList.remove("hide");
  $("vidOpts").classList.remove("hide");
  v.onloadedmetadata = () => {
    const max = Math.max(0.2, Math.floor(v.duration*10)/10);
    for(const id of ["vStart","vEnd"]){ $(id).max = max; }
    $("vStart").value = 0;
    $("vEnd").value = Math.min(max, 3);
    syncRange();
    updateInfo();
  };
}

// ---------- Ayarlar ----------
$("fps").oninput = () => { $("fpsV").textContent = $("fps").value; updateInfo(); };
$("cols").oninput = () => { $("colV").textContent = $("cols").value; };
$("res").onchange = () => {
  const c = $("res").value === "custom";
  $("cwWrap").classList.toggle("hide", !c);
  $("chWrap").classList.toggle("hide", !c);
  updateInfo();
};
["cw","ch","pp"].forEach(id => $(id).oninput = updateInfo);

// ---------- Video aralık seçici ----------
const fmtT = t => t.toFixed(1) + " sn";
function syncRange(src){
  const s = $("vStart"), e = $("vEnd"), gap = 0.1;
  let a = +s.value, b = +e.value;
  if(src === "s" && a > b - gap){ a = Math.max(0, b - gap); s.value = a; }
  if(src === "e" && b < a + gap){ b = Math.min(+e.max, a + gap); e.value = b; }
  const max = +s.max || 1;
  const f = $("rfill");
  f.style.left  = `calc(13px + (100% - 26px) * ${a/max})`;
  f.style.width = `calc((100% - 26px) * ${Math.max(0,(b-a)/max)})`;
  // iki tutamaç sağ uçta üst üste gelirse başlangıç tutamacı üstte olsun
  s.style.zIndex = a > max/2 ? 3 : 2;
  $("tStart").textContent = fmtT(a);
  $("tEnd").textContent = fmtT(b);
  $("tLen").textContent = "Süre: " + fmtT(b - a);
}
function previewAt(t){
  const v = $("vid");
  if(!v.src) return;
  v.pause();
  try{ v.currentTime = Math.min(t, Math.max(0, v.duration - 0.05)); }catch(_){}
}
$("vStart").addEventListener("input", () => { syncRange("s"); previewAt(+$("vStart").value); updateInfo(); });
$("vEnd").addEventListener("input",   () => { syncRange("e"); previewAt(+$("vEnd").value);   updateInfo(); });
$("setS").onclick = () => {
  const v = $("vid"); if(!v.src) return;
  $("vStart").value = Math.min(v.currentTime, +$("vEnd").value - 0.1);
  syncRange("s"); updateInfo();
};
$("setE").onclick = () => {
  const v = $("vid"); if(!v.src) return;
  $("vEnd").value = Math.max(v.currentTime, +$("vStart").value + 0.1);
  syncRange("e"); updateInfo();
};
$("playSel").onclick = () => {
  const v = $("vid"); if(!v.src) return;
  const a = +$("vStart").value, b = +$("vEnd").value;
  v.currentTime = a;
  v.play();
  const stop = () => { if(v.currentTime >= b || v.paused){ v.pause(); v.removeEventListener("timeupdate", stop); } };
  v.addEventListener("timeupdate", stop);
};

function targetSize(srcW, srcH){
  const r = $("res").value;
  if(r === "custom"){
    const cw = Math.min(3840, Math.max(16, Math.round(+$("cw").value) || 16));
    const ch = Math.min(2160, Math.max(16, Math.round(+$("ch").value) || 16));
    return [cw, ch];
  }
  if(r === "orig") return [srcW & ~1, srcH & ~1];
  const h = +r, w = Math.round(h*16/9);
  return [w, h];
}
function frameCount(){
  if(mode==="img") return images.length;
  const v = $("vid");
  if(!v.src) return 0;
  const dur = Math.max(0, (+$("vEnd").value) - (+$("vStart").value));
  return Math.max(1, Math.floor(dur * +$("fps").value));
}
function updateInfo(){
  const n = frameCount();
  let w=1920,h=1080;
  if($("res").value==="custom"){ w=+$("cw").value; h=+$("ch").value; }
  else if($("res").value!=="orig"){ h=+$("res").value; w=Math.round(h*16/9); }
  let txt = `${n} kare • ${w}×${h} • ~${(n/+$("fps").value).toFixed(1)} sn`;
  const pixels = n*w*h;
  const isMobile = matchMedia("(pointer:coarse)").matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(isMobile && w*h > 2560*1440) txt += `<br><span class="warn">⚠ Telefon/tablette 4K işlemi bellek yüzünden tarayıcıyı çökertebilir. Çözünürlüğü 1440p veya altına düşürmen önerilir.</span>`;
  if(pixels > 400e6) txt += `<br><span class="warn">⚠ Yüksek çözünürlük + çok kare: işlem yavaş olabilir ve dosya çok büyük çıkabilir. Kare sayısını/FPS'i düşürmeyi dene.</span>`;
  $("info").innerHTML = txt;
}

// ---------- Çizim ----------
function drawFit(ctx, src, sw, sh, W, H){
  ctx.fillStyle = $("bg").value;
  ctx.fillRect(0,0,W,H);
  const fit = $("fit").value;
  if(fit==="stretch"){ ctx.drawImage(src,0,0,W,H); return; }
  const s = fit==="cover" ? Math.max(W/sw,H/sh) : Math.min(W/sw,H/sh);
  const dw = sw*s, dh = sh*s;
  ctx.drawImage(src,(W-dw)/2,(H-dh)/2,dw,dh);
}
const tick = () => new Promise(r => setTimeout(r,0));

function seek(v,t){
  return new Promise(res => {
    const h = () => { v.removeEventListener("seeked",h); res(); };
    v.addEventListener("seeked",h);
    v.currentTime = t;
  });
}

// ---------- Oluştur ----------
$("cancel").onclick = () => { cancelled = true; };
$("go").onclick = async () => {
  const n = frameCount();
  if(!n){ $("status").textContent = "Önce kaynak ekle."; return; }

  cancelled = false;
  $("go").disabled = true;
  $("cancel").classList.remove("hide");
  $("prog").classList.remove("hide");
  $("prog").value = 0;
  $("result").style.display = "none";

  try{
    const v = $("vid");
    let sw, sh;
    if(mode==="img"){ sw = images[0].bmp.width; sh = images[0].bmp.height; }
    else { sw = v.videoWidth; sh = v.videoHeight; }
    const [W,H] = targetSize(sw,sh);

    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext("2d",{willReadFrequently:true});
    ctx.imageSmoothingQuality = "high";

    const fps = +$("fps").value;
    const delay = Math.round(1000/fps);
    const maxColors = +$("cols").value;
    const repeat = +$("loop").value;
    const gif = GIFEncoder();
    const start = +$("vStart").value;

    // Kare sırası (ping-pong için)
    const pp = $("pp").value === "1";
    const total = pp && n>2 ? n + (n-2) : n;
    const frameAt = k => k < n ? k : (n-2) - (k-n);

    for(let k=0;k<total;k++){
      if(cancelled) throw new Error("İptal edildi");
      const i = frameAt(k);
      if(mode==="img"){
        const b = images[i].bmp;
        drawFit(ctx,b,b.width,b.height,W,H);
      }else{
        await seek(v, Math.min(start + i/fps, v.duration-0.001));
        drawFit(ctx,v,v.videoWidth,v.videoHeight,W,H);
      }
      const { data } = ctx.getImageData(0,0,W,H);
      const palette = quantize(data, maxColors, { format:"rgb565" });
      const index = applyPalette(data, palette, "rgb565");
      gif.writeFrame(index, W, H, { palette, delay, repeat });

      $("prog").value = ((k+1)/total)*100;
      $("status").textContent = `Kare ${k+1} / ${total} işleniyor…`;
      await tick();
    }

    gif.finish();
    const blob = new Blob([gif.bytes()],{type:"image/gif"});
    if(lastURL) URL.revokeObjectURL(lastURL);
    lastURL = URL.createObjectURL(blob);

    $("out").src = lastURL;
    $("dl").href = lastURL;
    $("dl").download = `gif-${W}x${H}.gif`;
    $("meta").textContent = `${W}×${H} • ${total} kare • ${(blob.size/1048576).toFixed(2)} MB`;
    $("result").style.display = "block";
    $("status").textContent = "Tamamlandı ✅";
    $("result").scrollIntoView({behavior:"smooth"});
  }catch(e){
    $("status").textContent = "Hata: " + (e.message || e);
  }finally{
    $("go").disabled = false;
    $("cancel").classList.add("hide");
  }
};

updateInfo();
</script>
</body>
</html>
